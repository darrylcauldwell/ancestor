# Genealogy Research Agent — Regional Configuration
#
# Shareable reference data for your research area.
# Committed to git — other researchers in the same region can reuse this.
#
# Personal settings (seed profile, project name) go in config.local.yaml (gitignored).
# Credentials go in .env (gitignored).

# Discovery expansion bound (ENGINE_FOUNDATION_SPEC #Change7).
# Bounds how far from the probands/seeds the research engine is allowed to
# keep promoting leads, so a run stops burning budget on peripheral 5th
# cousins while the core tree still has gaps. Pick ONE policy:
#   generational:<M>  — at most M generations from any seed (parent/child
#                       hops; spouses share their partner's generation).
#   collateral:<N>    — at most N collateral hops from any proband; direct
#                       ancestors/descendants are always in bounds.
# Overridable per project (persisted on the project itself); the value here
# is the shared regional default. Omit / leave blank to use the engine
# default of generational:4.
expansion:
  policy: "generational:4"

region:
  county: "Derbyshire"
  chapman_code: "DBY"
  country: "England"
  default_location: "Derbyshire, England"

  # FreeBMD registration district IDs
  # Find yours at freebmd.org.uk → Search → District dropdown
  districts:
    Belper: "722"
    Ashbourne: "418"
    Bakewell: "691"
    Chesterfield: "1102"
    Derby: "1016"
    Basford: "707"
    Worksop: "630"
    Glossop: "81"

  # Which parishes each registration district covers
  # Used for geographic plausibility scoring
