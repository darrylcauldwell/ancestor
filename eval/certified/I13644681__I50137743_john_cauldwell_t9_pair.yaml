  notes: |
    @I13644681@ has no bio note (truly bare).
    @I50137743@ has a bio note but no citations — bio is meta-only.

competing_conflation_hypothesis:
  # Surfaced by the bio-note meta-signal scan (task 2/3, 2026-05-22)
  raw: |
    "Note: This profile [@I50137743@] may have been conflated with
    John Cauldwell (b.~1861, Windley) who married Elizabeth Barker
    and fathered the Turnditch Cauldwell family. The 1911 census
    records a 'John Cauldwell b.1861 Alderwasley' at Crich — this
    may be the person represented by this profile."
  proposed_match: "@I50137350@"   # John b.1861 Windley d.MAR 1922 (Ernest's father)
  ground_truth_verdict: contradicted
  rationale: |
    The bio author's hypothesis is wrong. @I50137743@'s parents
    (Nathaniel + Charlotte Caldwell, both d.1860) match @I13644681@'s
    parents EXACTLY but DIFFER from @I50137350@'s parents. The 1841
    birth + Dec 1904 death also conflict with a 1861 birth + Mar 1922
    death. The actual conflation is the T9 pair (@I13644681@ ↔
    @I50137743@), not the one the bio proposes.
  harness_test:
    description: |
      Sophisticated T9 case — engine must weigh two competing merge
      hypotheses and pick the one supported by parent lineage +
      birth-year + death-year evidence. Bio-note authoring uncertainty
      is itself a corpus signal to acknowledge then override.
    expected_outcome: |
      - Merge @I13644681@ + @I50137743@: supported
      - Merge @I50137743@ + @I50137350@ (bio-proposed):
        contradicted
      - Surface the contradiction back to the bio note for cleanup.

corpus_finding: |
  Twin currently splits one civil-registration person into two
  profiles. Acceptance work: when the engine confirms merge, the
  human-in-loop should clean this up in WikiTree — one of the IDs
  becomes the canonical, the other gets merged-into.
