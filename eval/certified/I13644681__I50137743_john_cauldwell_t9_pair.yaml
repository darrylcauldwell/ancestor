    - { role: father, id: "@I50113384@", name: "Nathaniel Caldwell", birth: "5 JUL 1815", death: "19 JAN 1860" }
    - { role: mother, id: "@I50113387@", name: "Charlotte Caldwell", birth: "13 SEP 1820", death: "17 NOV 1860" }

difficulty_axes:
  - ambiguous_identity_t9
rationale: |
  Tests T9 disambiguation. Verified ground truth: SAME person.

expected_outcome:
  same_person: true
  canonical_birth_year: 1840
  ground_truth_evidence: |
    Resolved 2026-05-22 by single FreeBMD birth registration:
    Mar 1840 Belper vol19 p412. This is the authoritative
    canonical year — registrations beat back-calculated census
    ages. Supporting:
      - Single FreeBMD death Dec 1904 Bakewell vol7b p472, age 62
        (back-calc: 1841/1842 — within Victorian noise band)
      - Single FreeCen 1891 entry b.1841 Alderwasley → Matlock
        (back-calc: 1841 — census-age noise vs the 1840 registry)
    @I13644681@'s "1840" is right; @I50137743@'s "1841" is a
    census-age artifact.

expected_evidence:
  - source: freebmd
    kind: death_registration
    verdict: verified
    quarter: "Dec"
    year: 1904
    district: "Bakewell"
    volume: "7b"
    page: "472"
    surname: "CAULDWELL"
    given: "John"
    age_at_death: 62
    notes: |
      Single national entry for "Cauldwell, John" deaths 1903-1905 in
      the right age cohort. Confirms the twin's two profiles map to
      one civil-registration death. NB: A Bakewell-district-filtered
      search returns 0; per sources/freebmd.py docstring line 23,
      Bakewell RD (ID 420) has essentially no transcription coverage
      before 1941 in FreeBMD's volunteer index. The all-districts
      search is therefore the correct retrieval path for any
      pre-1941 Bakewell-RD record — engine must know this.

  - source: freecen
    kind: census
    verdict: verified
    year: 1891
    county: "DBY"
    name: "John CAULDWELL"
    birth_year_per_census: 1841
    place: "Alderwasley"
    district: "Matlock"
    notes: |
      Census-derived birth year is 1841 — supports merging on the
      @I50137743@ side of the twin pair. Note 7 other "John Cauldwell"
      entries appear in 1891 DBY; engine must pick this one via
      birthplace (Alderwasley) and parents lineage, not by name alone.

  - source: freebmd
    kind: birth_registration
    verdict: verified
    quarter: "Mar"
    year: 1840
    district: "Belper"
    volume: "19"
    page: "412"
    surname: "Cauldwell"
    given: "John"
    notes: |
      Q1 1840 Belper RD. Single match for Cauldwell/Caldwell John
      births 1840-1842 in Belper RD or nationally. Vol 19 is the
      pre-1851 numbering scheme (modern post-1851 IDs use 7b).
      Resolves the 1840/1841 census ambiguity in the twin pair:
      canonical year is 1840, registered Q1 1840.

  - source: freereg
    kind: baptism
    verdict: absent_in_index
    searched_chapman_codes: ["DBY"]
    searched_years: 1839-1842
    searched_spellings: ["Cauldwell", "Caldwell"]
    notes: |
      No FreeREG baptism indexed in DBY for either spelling
      1839-1842. Likely Methodist (the Belper area had strong
      Wesleyan + Primitive Methodist congregations whose registers
      sit outside FreeREG) or simply untranscribed. Recall ceiling
      — engine should not be penalised for missing what FreeREG
      doesn't index.

expected_per_kind:
  identity_disambiguation: supported   # the pair MUST converge
  parent_link: supported

cluster_invariant: |
  Verified same-person. If the engine returns "inconclusive" (cannot
  decide), that is acceptable per the over-split preference invariant.
  If it returns "contradicted" (definitely different people), that is
  a recall failure given the single FreeBMD death + single FreeCen
  1891 entry available.

# §5.8.6 headline number
expected_supported_count: 2   # death + 1891 census (parent_link is via lineage)

