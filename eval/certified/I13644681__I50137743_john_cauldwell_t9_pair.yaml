# Certified-corpus subject for §5.8 eval harness
# Difficulty axis: ambiguous-identity (T9 target)
# Status: Verified 2026-05-22 via sources/freebmd.py and sources/freecen.py

# Ground truth (now verified): the two profiles are the SAME individual.
# Twin has a duplicate. Canonical birth year is 1841 (per 1891 census).

subjects:
  - profile_id: "@I13644681@"
    canonical_name: "John Cauldwell"
    seed_facts:
      - { field: birthDate, value: "1840", precision: year }
      - { field: birthLocation, value: "Alderwasley, Derbyshire, England" }
      - { field: deathDate, value: "12 NOV 1904", precision: day }
      - { field: deathLocation, value: "Matlock Bath, Derbyshire, England" }
  - profile_id: "@I50137743@"
    canonical_name: "John Cauldwell"
    seed_facts:
